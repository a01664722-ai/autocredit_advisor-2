name: Contrato de datos y pruebas

on:
  push:
    branches:
      - main
      - "prueba/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Validar CSV y ejecutar pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validar contrato del dato
        run: python -m scripts.verificar_contrato tests/fixtures/dato_invalido.csv

      - name: Pruebas automáticas
        run: python -m pytest -q
